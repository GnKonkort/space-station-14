- type: inventoryTemplate
  id: tallBorg
  slots:
    - name: head
      slotTexture: head
      slotFlags: HEAD
      uiWindowPos: 0,1
      strippingWindowPos: 0,0
      displayName: Head
    - name: suitstorage
      slotTexture: suit_storage
      slotFlags:   SUITSTORAGE
      slotGroup: MainHotbar
      stripTime: 10
      uiWindowPos: 2,0
      strippingWindowPos: 2,5
      displayName: Suit Storage
      offset: 0, -0.15           
    - name: id
      slotTexture: id
      slotFlags: IDCARD
      slotGroup: SecondHotbar
      stripTime: 10
      uiWindowPos: 2,1
      strippingWindowPos: 2,4
      displayName: ID
    - name: belt
      slotTexture: belt
      slotFlags: BELT
      slotGroup: SecondHotbar
      stripTime: 10
      uiWindowPos: 3,1
      strippingWindowPos: 1,5
      displayName: Belt
      offset: 0.02, -0.2
    - name: back
      slotTexture: back
      slotFlags: BACK
      slotGroup: SecondHotbar
      stripTime: 10
      uiWindowPos: 3,0
      strippingWindowPos: 0,5
      displayName: Back
      offset: 0, -0.15
    - name: pocket1
      slotTexture: pocket
      slotFlags: POCKET
      slotGroup: MainHotbar
      stripTime: 10
      uiWindowPos: 0,3
      strippingWindowPos: 0,4
      displayName: Pocket
      stripHidden: true      
      
- type: entity
  name: Высокий киборг
  description: Если что, Вы этого видеть не должны. Адмемы почините описание раз уж используете.
  parent: BaseMob
  id: tallBorgBase
  components:
  - type: Reactive
    groups:
      Acidic: [Touch]
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: NoSlip
  - type: StaticPrice
    price: 220000  
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 150
        mask:
        - MobMask
        layer:
        - MobLayer      
  - type: RotationVisuals
    horizontalRotation: 90
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
    allowRevives: true  
  - type: IdExaminable      
  - type: HealthExaminable
    examinableTypes:
      - Blunt
      - Slash
      - Piercing
      - Heat
      - Shock
    locPrefix: silicon    
  # - type: Access
  #   enabled: true
  #   groups:
  #   - AllAccess 
  - type: NpcFactionMember
    factions:
    - NanoTrasen   
  - type: Vocal
    sounds:
      Unsexed: FemaleReptilian
  - type: TTS
    voice: ignatiaflootravel  
  - type: Inventory
    templateId: tallBorg
  - type: InventorySlots
  - type: Body
    prototype: Reptilian
    requiredLegs: 1
  - type: Hands
    showInHands: false  
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Binary
    - Common
  - type: ActiveRadio
    channels:
    - Binary
    - Common
  - type: UserInterface
    interfaces:
      enum.SiliconLawsUiKey.Key:
        type: SiliconLawBoundUserInterface
      enum.BorgUiKey.Key:
        type: BorgBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface  
  - type: SiliconLawProvider
    laws: Corporate
  - type: SiliconLawBound              
  - type: ZombieImmune
  - type: Repairable
    doAfterDelay: 10
    allowSelfRepair: true      
  - type: TypingIndicator
    proto: robot 
  - type: Pullable
  - type: Insulated  
  - type: Puller
    needsHands: false
  - type: Tool
    speed: 2.5
    qualities:
      - Prying
  - type: Prying
    pryPowered: !type:Bool
        true
    force: !type:Bool
      true
    useSound:
      path: /Audio/Items/crowbar.ogg    
  - type: Tag
    tags:
    - ShoesRequiredStepTriggerImmune
    - DoorBumpOpener
    - CanPilot
    - FootstepSound    
  - type: StatusEffects
    allowed:
    - SlowedDown    
  - type: Emoting       
  - type: Sprite
    sprite: /Uploaded/tallBorg/base.rsi
    offset: 0,0.4
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: alive-unshaded
      shader: unshaded      
  - type: Appearance
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
        BaseUnshaded: alive-unshaded
      Dead:
        Base: alive    
  - type: SlowOnDamage
    speedModifierThresholds:
      70: 0.8
      150: 0.6
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 5  
  - type: MeleeWeapon
    altDisarm: true   
    damage:
     types:
       Blunt: 5
       Slash: 10
       Piercing: 5     
  - type: UnblockableSpeech
  - type: ShowJobIcons  
  - type: Damageable
    damageContainer: Silicon  
  - type: Climbing
  - type: NameIdentifier
    group: GenericNumber
  - type: ComplexInteraction
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: hugging-success-generic
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-generic-others    

